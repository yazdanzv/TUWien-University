<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" font-family="Arial, sans-serif"><title>Austria&#x27;s EU-relative housing overburden index, 2015–2025</title><desc>The Austria/EU rate ratio is indexed to 2015=100 and rises to 142.9. This figure suppresses the constituent rate paths and visually foregrounds a 43% increase in relative standing, which must not be mistaken for a 43% rise in Austria&#x27;s domestic rate.</desc><rect width="1280" height="920" fill="white"/><text x="55" y="65" fill="#172b36" font-size="35" font-weight="700" text-anchor="start">Austria’s housing overburden index</text><text x="55" y="140" fill="#087d80" font-size="60" font-weight="700" text-anchor="start">Up 43% in a decade</text><text x="55" y="190" fill="#536572" font-size="23" font-weight="400" text-anchor="start">Lowest-income fifth · Austria ÷ EU-27 · 2015–2025</text><text x="120" y="285" fill="#172b36" font-size="23" font-weight="700" text-anchor="start">Index (2015 = 100)</text><line x1="120" y1="750.0" x2="1000" y2="750.0" stroke="#dce3e7" stroke-width="1"/><text x="100" y="757.0" fill="#536572" font-size="22" font-weight="400" text-anchor="end">90</text><line x1="120" y1="690.0" x2="1000" y2="690.0" stroke="#536572" stroke-width="1.5"/><text x="100" y="697.0" fill="#536572" font-size="22" font-weight="400" text-anchor="end">100</text><line x1="120" y1="630.0" x2="1000" y2="630.0" stroke="#dce3e7" stroke-width="1"/><text x="100" y="637.0" fill="#536572" font-size="22" font-weight="400" text-anchor="end">110</text><line x1="120" y1="570.0" x2="1000" y2="570.0" stroke="#dce3e7" stroke-width="1"/><text x="100" y="577.0" fill="#536572" font-size="22" font-weight="400" text-anchor="end">120</text><line x1="120" y1="510.0" x2="1000" y2="510.0" stroke="#dce3e7" stroke-width="1"/><text x="100" y="517.0" fill="#536572" font-size="22" font-weight="400" text-anchor="end">130</text><line x1="120" y1="450.0" x2="1000" y2="450.0" stroke="#dce3e7"